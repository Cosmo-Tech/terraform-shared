apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pvc-patcher-role
  namespace: ${namespace}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "patch", "update", "annotate"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
auth:
  enabled: true
  username: admin
  existingSecret: "${SUPERSET_SECRET_NAME}"

beat:
  enabled: false

defaultInitContainers:
  waitForDB:
    enabled: false
    resourcesPreset: nano
  waitForRedis:
    enabled: true
    resourcesPreset: nano

existingConfigmap: "${CONFIGMAP_NAME}"

ingress:
  enabled: true
  ingressClassName: traefik
  apiVersion: ""
  hostname: "${SUPERSET_CLUSTER_DOMAIN}"
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # extraHosts: []
  # extraPaths: []
  # extraRules: []
  extraTls:
    - hosts:
        - "${SUPERSET_CLUSTER_DOMAIN}"
      secretName: letsencrypt-prod
  # tls: []
  # secrets: []
  selfSigned: false

postgresql:
  enabled: false

externalDatabase:
  host: "superset-postgresql-rw.${NAMESPACE}.svc.cluster.local"
  port: 5432
  database: bitnami_superset
  user: bn_superset
  existingSecret: "${SUPERSET_POSTGRESQL_SECRET_NAME}"
  existingSecretPasswordKey: "password"

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: "${SUPERSET_REDIS_SECRET_NAME}"
    username: default
  image:
    registry: ${IMAGE_REGISTRY}
    # repository: cosmotech/redis
    repository: cosmotech/redis-server-iamguarded
    pullPolicy: IfNotPresent
  master:
    nodeSelector:
      "cosmotech.com/tier": "db"
    tolerations:
      - effect: NoSchedule
        key: vendor
        operator: Equal
        value: cosmotech
    resourcesPreset: nano
    service:
      ports:
        redis: 6379
    persistence:
      enabled: true
      existingClaim: "${PERSISTENCE_REDIS_PVC}"
  # command: ["redis-server"]

init:
  enabled: true
  extraEnvVars:
    - name: SUPERSET_OAUTH_PROVIDERS
      valueFrom:
        configMapKeyRef:
          key: oauth-providers
          name: ${OAUTH_PROVIDERS_CONFIGMAP_NAME}
          optional: true
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: secret-key
          name: ${SUPERSET_SECRET_KEY_NAME}
    - name: PYTHONPATH
      value: /opt/custom-python-packages
  initContainers:
    - name: wait-for-db
      image: postgres:17
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
            echo "Waiting for database $PGHOST:$PGPORT..."
            sleep 2
          done
          echo "Database is ready"
      env:
        - name: PGHOST
          value: "superset-postgresql-rw.${NAMESPACE}.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: bn_superset
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SUPERSET_POSTGRESQL_SECRET_NAME}
              key: password
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    - name: python-requirements
      image: python:3.11-slim
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - pip install --target=/custom-pip --no-deps flask-cors Flask-OAuthlib authlib joserfc
      volumeMounts:
        - name: python-requirements
          mountPath: /custom-pip

  extraVolumes:
    - name: python-requirements
      emptyDir: {}
  extraVolumeMounts:
    - name: python-requirements
      mountPath: /opt/custom-python-packages
  resourcesPreset: medium

web:
  extraEnvVars:
    - name: SUPERSET_OAUTH_PROVIDERS
      valueFrom:
        configMapKeyRef:
          key: oauth-providers
          name: ${OAUTH_PROVIDERS_CONFIGMAP_NAME}
          optional: true
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: secret-key
          name: ${SUPERSET_SECRET_KEY_NAME}
    - ${PYTHON_REQUIREMENTS_EXTRA_ENV_VARS}
  initContainers:
    ${PYTHON_REQUIREMENTS_INIT_CONTAINER}
  extraVolumes:
    ${PYTHON_REQUIREMENTS_INIT_CONTAINER_VOLUMES}
  extraVolumeMounts:
    ${PYTHON_REQUIREMENTS_INIT_CONTAINER_VOLUME_MOUNTS}
  # podSecurityContext:
  #   enabled: true
  #   fsGroup: 1001
  #   runAsUser: 1001
  nodeSelector:
    cosmotech.com/tier: services
  tolerations: 
  - effect: NoSchedule
    key: vendor 
    operator: Equal 
    value: cosmotech
    resourcesPreset: nano

worker:
  command:
  - celery
  - worker
  - --concurrency=2
  - --loglevel=INFO
  extraEnvVars:
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          key: redis-password
          name: ${SUPERSET_REDIS_SECRET_NAME}
    - name: CELERY_BROKER_URL
      value: redis://default:$(REDIS_PASSWORD)@superset-redis-master:6379/0
    - name: CELERY_RESULT_BACKEND
      value: redis://default:$(REDIS_PASSWORD)@superset-redis-master:6379/0
    - name: SUPERSET_OAUTH_PROVIDERS
      valueFrom:
        configMapKeyRef:
          key: oauth-providers
          name: ${OAUTH_PROVIDERS_CONFIGMAP_NAME}
          optional: true
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: secret-key
          name: ${SUPERSET_SECRET_KEY_NAME}
    - ${PYTHON_REQUIREMENTS_EXTRA_ENV_VARS}
  initContainers:
    ${PYTHON_REQUIREMENTS_INIT_CONTAINER}
  extraVolumes:
    ${PYTHON_REQUIREMENTS_INIT_CONTAINER_VOLUMES}
  extraVolumeMounts:
    ${PYTHON_REQUIREMENTS_INIT_CONTAINER_VOLUME_MOUNTS}
  # podSecurityContext:
  #   enabled: true
  #   fsGroup: 1001
  #   runAsUser: 1001
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: 4
      memory: 6Gi
    requests:
      cpu: 3
      memory: 4Gi
  nodeSelector:
    cosmotech.com/tier: services
  tolerations: 
  - effect: NoSchedule
    key: vendor 
    operator: Equal 
    value: cosmotech

image:
  repository: cosmotech/superset-iamguarded
  pullPolicy: IfNotPresent
  debug: true

global:
  storageClass: "${PERSISTENCE_STORAGE_CLASS}"
  imageRegistry: ${IMAGE_REGISTRY}
  imagePullSecrets:
  - name: ${IMAGE_REGISTRY_AUTH_SECRET}
image:
  repository: ${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}
  tag: ${IMAGE_TAG}
  pullPolicy: IfNotPresent

imagePullSecrets:
    ${IMAGE_REGISTRY_AUTH_SECRET_LIST}

config:
  clusterWide: true

serviceAccount:
  create: true

rbac:
  create: true

webhook:
  mutating:
    create: true
  validating:
    create: true

crds:
  create: true